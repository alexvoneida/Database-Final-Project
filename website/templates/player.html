{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item active">{{ info[0] }}</li>
            </ol>
        </nav>
        <div class="d-flex align-items-center">
            <div class="bg-primary text-white rounded-3 p-3 me-3 shadow">
                <h2 class="mb-0">{{ info[1] }}</h2>
            </div>
            <h1 class="display-4 fw-bold mb-0">{{ info[0] }}</h1>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4">
            <h4 class="fw-bold mb-3">Select a Game</h4>
            <p class="text-muted">Choose a game to view rolling stats and model predictions.</p>
            <div class="input-group">
                <select class="form-select form-select-lg" id="gameSelect">
                    <option selected disabled>Choose a game...</option>
                    {% for game_id, game_date, matchup in games %}
                        <option value="{{ game_id }}">{{ game_date }} — {{ matchup }}</option>
                    {% endfor %}
                </select>
                <button class="btn btn-primary px-4" onclick="goToGame()">View</button>
            </div>
        </div>
    </div>
</div>

<script>
    function goToGame() {
        const id = document.getElementById('gameSelect').value;
        if (id !== "Choose a game...") window.location.href = '/player/{{ player_id }}/game/' + id;
    }
</script>
{% endblock %}
